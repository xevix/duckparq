name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      big:
        description: "Also generate the 10M-row fixture and run the scale section"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant. main is
# exempt: those runs produce the artifact people download.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and test
    # macos-14 and later are Apple silicon, which is the only architecture the
    # vendored DuckDB bundle exists for. 15 also matches the deployment target.
    #
    # Keep this a *standard* runner label. Standard runners are free on public
    # repositories with no minute cap; larger runners (the -xlarge labels) are
    # billed even on public repos.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      # Full history rather than the default shallow clone, so make-app.sh can
      # derive a version from the nearest tag. Without it CI stamps 0.0.0 while
      # a developer building the same commit gets the tag — the two should not
      # disagree. The repo is small enough that the clone costs nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-app
        id: build
        with:
          big: ${{ inputs.big }}

      - uses: actions/upload-artifact@v7
        with:
          name: DuckParq-${{ github.sha }}
          path: ${{ steps.build.outputs.zip-path }}
          if-no-files-found: error
          retention-days: 14

      # No `if: always()` — a summary describing a downloadable app would be
      # untrue on a run that failed before building one.
      - name: Summary
        run: |
          {
            echo "## DuckParq.app"
            echo
            echo "Built from \`${GITHUB_SHA:0:7}\` on \`$(sw_vers -productVersion)\`, Apple silicon."
            echo
            echo "The app is **ad-hoc signed**, not Developer ID signed or notarised."
            echo "macOS quarantines anything downloaded from the internet, so an"
            echo "artifact from this run will refuse to open on a first double-click."
            echo "Clear the quarantine flag after unzipping:"
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine DuckParq.app'
            echo '```'
            echo
            echo "Building it yourself with \`make run\` avoids this entirely --"
            echo "nothing locally built is quarantined."
          } >> "$GITHUB_STEP_SUMMARY"
